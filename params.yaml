project:
  group_id: G055
  problem_id: MP148
  name: Tea Leaf Yield Prediction

paths:
  raw_train: data/raw/train.csv
  raw_later: data/raw/later.csv
  raw_holdout: data/raw/holdout_features.csv
  processed_train: data/processed/train_clean.csv
  processed_val: data/processed/val_clean.csv
  v1_model_dir: models/tea_leaf_v1
  v2_model_dir: models/tea_leaf_v2
  v3_model_dir: models/tea_leaf_v3
  v4_model_dir: models/tea_leaf_v4
  mlflow_db: mlflow.db
  reports_dir: reports
  predictions_dir: predictions

data:
  target_column: kg_per_worker
  id_column: record_id
  date_column: date
  group_column: section
  features:
    - worker_exp_yr
    - rain_mm_week
    - slope_deg
    - temp_c
    - bush_age_yr
    - hours_worked
    - flush
    - section
  numeric_columns:
    - worker_exp_yr
    - rain_mm_week
    - slope_deg
    - temp_c
    - bush_age_yr
    - hours_worked
    - kg_per_worker
  suspicious_target_threshold: 100.0

cleaning:
  validation_cutoff: "2026-06-01"
  experience_column: worker_exp_yr
  experience_unit_group: "River Side"
  experience_conversion_factor: 12
  slope_column: slope_deg
  slope_min: 0
  slope_max: 90

training:
  random_state: 42
  dummy:
    strategy: median
  random_forest:
    n_estimators: 200
    n_jobs: -1
  hist_gradient_boosting:
    max_iter: 200
  preprocessing:
    numeric_imputation: median
    categorical_imputation: most_frequent
  robust:
    exclude_suspicious_targets: true
  reports:
    baseline_comparison: baseline_model_comparison.csv
    robust_comparison: robust_model_comparison.csv

monitoring:
  baseline_model_version: 3
  baseline_model_dir: models/tea_leaf_v3
  psi_bins: 10
  psi_binning_method: quantile
  psi_epsilon: 1.0e-6
  psi_thresholds:
    moderate: 0.1
    significant: 0.25
  drift_report_filename: drift_report.csv
  group_performance_filename: group_performance.csv
  chart_filename: drift_and_group_mae.png

retraining:
  baseline_model_version: 3
  baseline_model_dir: models/tea_leaf_v3
  baseline_run_id: "50a5ecb488a3438aa1d76aece128c2b2"
  retrained_model_dir: models/tea_leaf_v4
  retrained_model_name: HistGradientBoosting_v4_corrected
  historical_model_dirs:
    - models/tea_leaf_v1
    - models/tea_leaf_v2
    - models/tea_leaf_v3
  later_train_ratio: 0.7
  promotion_improvement_threshold: 0.05
  model_type: HistGradientBoostingRegressor
  max_iter: 200
  random_state: 42
  comparison_filename: model_comparison.csv
  decision_filename: promotion_decision.json

mlflow:
  experiment_name: Tea_Leaf_Yield_Prediction
  registered_model_name: TeaLeafYieldPredictor
  champion_alias: champion

serving:
  model_dir: models/tea_leaf_v4
  model_version: 4
  registered_model_name: TeaLeafYieldPredictor
  champion_alias: champion
  max_hours_worked: 15
  min_rain_mm_week: 0
